name: Rust CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_path: build/release/hello
          - os: windows-latest
            artifact_path: build/release/hello.exe
          - os: macos-latest
            artifact_path: build/release/hello

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run CI script (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./ci.sh

      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call ci.bat

      - name: Upload release executable
        uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
